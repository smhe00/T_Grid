notes: "Independent audit of Core 0.4.1 rev2 candidate feature/0.4.1-runtime-authority @ 54b2cbea returned CHANGES_REQUIRED on one remaining P1 uniqueness blocker. Accepted Rev2 fixes/regression baseline: MiniQmtRuntimeConfig no longer exposes production coordination_path or authority_root; normal shared runtime resolves Authority with bootstrap=False; explicit bootstrap-authority operation exists; account_key is recomputed from environment/account_type/account_id_sha256; Authority-bound DB requires exactly one identity row; DB path+UUID+authority_id identity binding and OS-lock bootstrap remain; self-certified 114 tests and unchanged 3-process formal state space are retained only as regression evidence. Remaining P1: default_authority_root() still reads process environment LOCALAPPDATA on Windows despite claiming a non-overridable root, so two processes for the same OS user/account can carry different LOCALAPPDATA values and resolve two Authority/DB domains. Required Rev3: resolve Windows LocalAppData via OS Known Folder API (FOLDERID_LocalAppData/equivalent), no environment/home fallback; fail closed if authoritative root lookup fails. POSIX must use OS user database and fail closed on lookup failure. Remove --authority-root from production bootstrap-authority CLI so bootstrap and normal runtime share exactly the same canonical resolver. Add Windows mutable-LOCALAPPDATA + cross-process regressions, open PR, and run Python 3.9/3.11/3.12 + Windows + wheel/install + formal release gates. Core audit/task: docs/ARCHITECT_AUDIT_V0_4_1_RUNTIME_AUTHORITY_REV2.md and docs/IMPLEMENTATION_TASK_V0_4_1_RUNTIME_AUTHORITY_REV3.md on the Core feature branch. TGrid remains pinned to acf20d9 and must not adapt/run Gate-6 orders before final reviewed Core merge SHA is locked. No real or simulation QMT order/cancel authorized; live_trading_allowed=false."
