notes: "Independent audit of Core candidate feature/0.4.1-runtime-authority @ d4992543 returned CHANGES_REQUIRED. Accepted regression baseline: Account Runtime Authority model, persistent DB UUID + authority_id metadata, OS-lock cross-process bootstrap machinery, fail-closed identity mismatch matrix, Core 0.4 state/formal semantics, self-certified 108-test result. P1 blockers: (1) production MiniQmtRuntimeConfig still exposes caller-selectable authority_root, allowing same account_key to bootstrap two Authority/DB domains under different roots; production authority root must be canonical/non-overridable, with alternate roots isolated to low-level/test APIs only. (2) normal MiniQmtRuntime.connect calls resolve(... bootstrap=True); normal runtime must never recreate a missing Authority. Explicit operator bootstrap must be separate; deleting both established Authority+DB then starting a normal runtime must fail closed and create no replacement files. (3) production MiniQmtRuntimeConfig.coordination_path still bypasses Authority and restores 0.4.0 split-brain behavior; explicit-path support may remain only as low-level/test compatibility, not production shared-runtime configuration. P2: recompute/validate account_key from identity tuple, exactly-one DB identity row, orphan-DB recovery docs/tooling. Detailed Core-branch audit: docs/ARCHITECT_AUDIT_V0_4_1_RUNTIME_AUTHORITY.md; revised task: docs/IMPLEMENTATION_TASK_V0_4_1_RUNTIME_AUTHORITY.md. Do not merge d4992543. No TGrid Authority adaptation or Gate-6 simulation order/cancel until revised Core candidate passes audit and merge SHA is locked. live_trading_allowed=false."
