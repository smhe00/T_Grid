notes: "Core 0.4.1 rev3 handed back for final independent audit on qmt-execution-core PR #4 (branch feature/0.4.1-runtime-authority, head 689aa6c825489a40fad9dbbead39961ec8d628e5). Rev3 closes the last P1 (canonical authority root non-overridable): default_authority_root() no longer reads process environment — Windows uses FOLDERID_LocalAppData via SHGetKnownFolderPath (ctypes, CoTaskMemFree via ctypes.cast), POSIX uses pwd.getpwuid(os.getuid()); both fail closed with RuntimeAuthorityError and never fall back to LOCALAPPDATA/USERPROFILE/HOME/Path.home. Production bootstrap-authority CLI no longer exposes --authority-root and calls the same module-level default_authority_root() as the runtime. New regressions all PASS: Windows mutable os.environ LOCALAPPDATA leaves root unchanged; two real OS processes with different LOCALAPPDATA resolve the same canonical root; Known Folder lookup failure fails closed; POSIX user-db failure fails closed; bootstrap-authority --help has no --authority-root; explicit CLI bootstrap then normal runtime resolve the same canonical Authority and verify with zero broker side effects. Rev2 accepted fixes preserved (no production coordination_path/authority_root config routes; bootstrap=False normal runtime; account_key recomputation; exactly-one DB identity row; DB UUID/authority_id binding; OS-lock cross-process bootstrap). Gates: full pytest 119 passed / 1 skipped (POSIX-only) on CPython 3.12 and real Windows Python 3.9.13 (wheel install); compileall 0; wheel clean install + out-of-tree qmt-execution-core verify PASS; release formal gate unchanged 433,489 states / 4,461,994 edges / 0 violations; 3.9 ast parse NONE failed. TGrid unchanged (pin acf20d9). Next: independent audit of PR #4; after PASS + merge, TGrid follow-up pins the reviewed merge SHA and switches production composition to Authority resolution (removing production coordination_path / Gate-6 --coordination-db). No real or simulation QMT order/cancel invoked. live_trading_allowed=false."
