notes: "Architect audit of TGrid Iter16 implementation bef47b3f: CHANGES_REQUIRED on one P1 architecture blocker. Iter16 functional integration is retained as accepted regression baseline (913 tests): Core 0.4 exact pin, one runtime/session authority, shared symbol/cash coordination, explicit cash estimator, coordinate->TGrid sidecar->broker ordering, finality-aware UNKNOWN/CANCEL_REJECTED/FAILED+QUARANTINED non-release, safe journal cutover, three-runtime distinct-symbol concurrency, same-symbol exclusion, shared-cash non-overcommit, quarantine/account isolation, bounded session-id leasing. Blocker: production still trusts caller-supplied coordination_path and Gate-6 exposes --coordination-db, so same account can be split across two SQLite domains. New required public-Core hardening: qmt-execution-core 0.4.1 Account Runtime Authority, specified in docs/CORE_0_4_1_RUNTIME_AUTHORITY_SPEC.md and docs/IMPLEMENTATION_TASK_V0_4_1_RUNTIME_AUTHORITY.md. Authority must be canonical per account_key and certify a dedicated DB by canonical path + persistent db_uuid + authority_id; DB metadata must bind the same identity; concurrent bootstrap OS-locked; mismatch/corruption/recreated DB fail closed; production strategy must not select arbitrary coordination_path. Implement Core first on separate PR, run formal/refinement/cross-process/Windows/Python>=3.9 gates, return for independent audit, merge only on PASS, then pin TGrid to exact reviewed Core SHA and remove production coordination_path/--coordination-db selection. No real or simulation QMT order/cancel authorized; live_trading_allowed=false."
