[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tgrid"
version = "0.1.0"
description = "TGrid QMT low-frequency T-trading engine (Gate 0 skeleton; no QMT or trading capability)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # PyYAML is used only to parse the YAML configuration file
    # (tgrid.config.load_config); no other third-party runtime package is
    # permitted at this Gate.
    "PyYAML>=6.0",
    # Migration Phase A0/A (2026-08-16): TGrid consumes the independently
    # audited reusable execution core, pinned to an EXACT reviewed commit.
    # Iteration 16 final (2026-08-16): Core 0.4.1 / a68572d (Account Runtime
    # Authority, merged after PR #4 independent audit PASS) — production
    # shared mode resolves the OS-derived canonical per-account Authority,
    # certifies a dedicated coordination DB (path + db_uuid + authority_id),
    # requires an explicit operator bootstrap, and carries no production
    # coordination_path / authority_root configuration route. Local
    # developers override this pin with an editable install from the local
    # checkout (documented in work/gates/QMT_EXECUTION_CORE/); the absolute
    # local path is never committed here.
    "qmt-execution-core @ git+https://github.com/smhe00/qmt-execution-core@a68572decb799bcbbf1b2892fcf58ac321ce9636",
]

[project.scripts]
tgrid = "tgrid.main:main"

[tool.setuptools.packages.find]
where = ["src"]
