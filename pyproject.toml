[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tgrid"
version = "0.1.0"
description = "TGrid QMT low-frequency T-trading engine (Gate 0 skeleton; no QMT or trading capability)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # PyYAML is the sole runtime dependency. It is used only to parse the YAML
    # configuration file in tgrid.config.load_config; no other third-party
    # runtime package is permitted at this Gate.
    "PyYAML>=6.0",
]

[project.scripts]
tgrid = "tgrid.main:main"

[tool.setuptools.packages.find]
where = ["src"]
